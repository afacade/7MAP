<html lang="vi">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Where the site is served from. Local development runs at the domain
         root; on GitHub Pages this repo is a project site under /7MAP/. The
         script must run before the first stylesheet link below so the browser
         resolves every relative URL against the right base.

         The test is the URL itself, not the hostname: any address under
         /7MAP/ uses that base, anything else stays at the root. So local
         development, a future custom domain (which serves at the root) and
         GitHub Pages all work with no edit. Rename SUBPATH only if the repo
         is renamed. -->
    <base id="app-base" href="/" />
    <script>
      (function () {
        var SUBPATH = '/7MAP/';
        if (location.pathname.indexOf(SUBPATH) === 0) {
          document.getElementById('app-base').setAttribute('href', SUBPATH);
        }
      })();
    </script>
